name: Migration agent CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify migration agent
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check and run migration verification
        run: npm test

      - name: Enforce migration success-rate quality gate
        id: quality
        run: npm run quality:gate

      - name: Build React dashboard
        run: npm run build:dashboard

      - name: Retain migration success-rate history
        if: always() && steps.quality.outputs.report_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: migration-success-rate-${{ github.run_id }}
          path: ${{ steps.quality.outputs.report_path }}
          if-no-files-found: error
          retention-days: 90
